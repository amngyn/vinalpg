<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/logo/vinalpglogo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="contact.css">
</head>
<body>

        <div id="site-header"></div>



<!-- HERO -->
<section class="contact-hero">
</section>

<!-- CONTACT CONTENT -->
<div class="contact-wrapper">
        <nav class="prod-breadcrumb">
            <a href="index.html" data-key="bc_home">Home</a>
            <i class="fa-solid fa-chevron-right"></i>
            <a href="contact.html" class="bc-active" data-key="bc_contact">Contact</a>
        </nav>


    <h2 class="title" data-key="getintouch">Get in Touch</h2>
    <div class="contact-container">
        <!-- Left side: Cards -->
        <div class="contact-cards">
            <div class="contact-card">
                <div class="card-icon">
                    <i class="fa-solid fa-phone"></i>
                </div>
                <div class="card-text">
                    <h2 data-key="phone">Phone</h2>
                    <p>+84 2862 747 789</p>
                </div>
            </div>

            <div class="contact-card">
                <div class="card-icon">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="card-text">
                    <h2 data-key="email">Email</h2>
                    <p>vinalpgas@com.vn</p>
                </div>
            </div>

            <div class="contact-card">
                <div class="card-icon">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <div class="card-text">
                    <h2 data-key="address_title">Address</h2>
                    <p data-key="address_text">Floor 2, 181 Cao Thang Street, Hoa Hung Ward, District 10, Ho Chi Minh City</p>
                </div>
            </div>

            <form class="contact-form" action="mailto:vinalpgas@com.vn" method="post" enctype="text/plain">
                <div class="form-header">
                    <h3>Project Inquiry</h3>
                    <p>Send us the basic project details and our team will follow up.</p>
                </div>

                <div class="form-grid">
                    <div class="form-row">
                        <label for="contactName">Full Name</label>
                        <input id="contactName" name="Full Name" type="text" autocomplete="name" required>
                    </div>

                    <div class="form-row">
                        <label for="contactCompany">Company</label>
                        <input id="contactCompany" name="Company" type="text" autocomplete="organization">
                    </div>

                    <div class="form-row">
                        <label for="contactEmail">Email</label>
                        <input id="contactEmail" name="Email" type="email" autocomplete="email" required>
                    </div>

                    <div class="form-row">
                        <label for="contactPhone">Phone</label>
                        <input id="contactPhone" name="Phone" type="tel" autocomplete="tel">
                    </div>
                </div>

                <div class="form-row">
                    <label for="contactSubject">Inquiry Type</label>
                    <select id="contactSubject" name="Inquiry Type" required>
                        <option value="">Select an inquiry type</option>
                        <option value="Equipment supply">Equipment supply</option>
                        <option value="Turnkey project">Turnkey project</option>
                        <option value="Installation and commissioning">Installation and commissioning</option>
                        <option value="Service or maintenance">Service or maintenance</option>
                        <option value="Training">Training</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <fieldset class="form-fieldset">
                    <legend>Interested Products / Services</legend>
                    <div class="choice-grid">
                        <label><input type="checkbox" name="Interest" value="Filling systems"> Filling systems</label>
                        <label><input type="checkbox" name="Interest" value="Pumps and compressors"> Pumps and compressors</label>
                        <label><input type="checkbox" name="Interest" value="Pipeline valves"> Pipeline valves</label>
                        <label><input type="checkbox" name="Interest" value="Tank gauging"> Tank gauging</label>
                        <label><input type="checkbox" name="Interest" value="Loading arms"> Loading arms</label>
                        <label><input type="checkbox" name="Interest" value="Vaporizers and mixers"> Vaporizers and mixers</label>
                    </div>
                </fieldset>

                <div class="form-grid">
                    <div class="form-row">
                        <label for="contactLocation">Project Location</label>
                        <input id="contactLocation" name="Project Location" type="text" autocomplete="address-level2">
                    </div>

                    <div class="form-row">
                        <label for="contactTimeline">Timeline</label>
                        <select id="contactTimeline" name="Timeline">
                            <option value="">Select timeline</option>
                            <option value="Immediate">Immediate</option>
                            <option value="1-3 months">1-3 months</option>
                            <option value="3-6 months">3-6 months</option>
                            <option value="6+ months">6+ months</option>
                        </select>
                    </div>
                </div>

                <fieldset class="form-fieldset">
                    <legend>Preferred Contact</legend>
                    <div class="choice-row">
                        <label><input type="radio" name="Preferred Contact" value="Email" checked> Email</label>
                        <label><input type="radio" name="Preferred Contact" value="Phone"> Phone</label>
                        <label><input type="radio" name="Preferred Contact" value="Either"> Either</label>
                    </div>
                </fieldset>

                <div class="form-row">
                    <label for="contactMessage">Project Details</label>
                    <textarea id="contactMessage" name="Project Details" rows="6" placeholder="Tell us about capacity, existing equipment, site requirements, or any technical questions." required></textarea>
                </div>

                <button class="contact-submit" type="submit">
                    <span>Send Inquiry</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>

        <!-- Right side: Google Map -->
        <div class="contact-map-wrapper">
            <iframe frameborder="0" style="border:0" referrerpolicy="no-referrer-when-downgrade"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d979.8694099943931!2d106.67410232850175!3d10.774682399333113!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752ff90b28e2a7%3A0xd5907b763ed74d36!2sT%C3%B2a%20Nh%C3%A0%20Charmington%20La%20Pointe!5e0!3m2!1sen!2s!4v1776575015226!5m2!1sen!2s"
            allowfullscreen>
            </iframe>
        </div>
    </div>
</div>




<!-- FOOTER -->
    <div id="site-footer"></div>



    <script src="shared.js"></script>
    <script src="contact.js"></script>
</body>
</html>
